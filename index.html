<!DOCTYPE html>
<html>
<head>
<title>Termin buchen · Jordanka Dulle</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<base target="_top">
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=Source+Sans+3:wght@400;600&family=Source+Serif+4:opsz,wght@8..60,600&display=swap" rel="stylesheet">
<style>
  /* Цветове от визитката: тъмносиньо, сиво, праскова, синьо-сиво, лавандула */
  :root {
    --ink: #1f2b5e; --text: #2c303b; --muted: #6c7180; --bg: #ffffff; --card: #ffffff;
    --line: #e3e2de; --pill: #ececee; --soft: #edf0f7; --slate: #5d7298;
    --peach: #e2a377; --sage: #858b85; --lav: #959ac1; --danger: #b3412f;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 17px/1.55 "Source Sans 3", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 28px 16px 56px; }
  h1, h2, .brand-name { font-family: "Source Serif 4", Georgia, serif; font-weight: 600; color: var(--ink); }
  h1 { font-size: 1.55rem; line-height: 1.25; margin: 0 0 6px; }
  h2 { font-size: 1.15rem; margin: 28px 0 12px; }
  p.sub { color: var(--muted); margin: 0 0 18px; }

  .brand { display: flex; align-items: center; gap: 14px; margin-bottom: 26px; }
  .brand .logo { flex: none; width: auto; height: 64px; }
  .brand-name { font-size: 1.35rem; line-height: 1.1; }
  .brand-tag { font-family: "Caveat", cursive; font-size: 1.25rem; color: #4b524d; line-height: 1.1; }
  .rule { width: 56px; height: 3px; background: var(--ink); border-radius: 2px; margin: 6px 0 8px; opacity: .85; }

  .step { display: none; }
  .step.on { display: block; animation: fade .25s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

  button { font: inherit; cursor: pointer; border-radius: 14px; }
  .choice { display: block; width: 100%; text-align: left; padding: 16px 18px; margin: 0 0 12px;
            background: var(--card); border: 1px solid var(--line); color: var(--text);
            box-shadow: 0 1px 2px rgba(31, 43, 94, .05); transition: border-color .15s, box-shadow .15s; }
  .choice:hover, .choice:focus-visible { border-color: var(--slate); outline: none;
            box-shadow: 0 3px 10px rgba(31, 43, 94, .10); }
  .choice small { display: block; color: var(--muted); margin-top: 2px; }
  #services .choice { font-weight: 600; color: var(--ink); }
  #services .choice small { font-weight: 400; }
  #services .choice small.desc { color: var(--text); font-size: .9rem; margin-top: 4px; }
  #services .choice small.meta { color: var(--slate); font-weight: 600; margin-top: 6px; }
  .langs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .langs .choice { text-align: center; font-size: 1.1rem; font-weight: 600; color: var(--ink); padding: 18px 6px; }
  .back { background: none; border: none; color: var(--slate); padding: 0; margin-bottom: 14px; font-weight: 600; }

  .cal { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px 10px 10px; }
  .cal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; padding: 0 4px; }
  .cal-head span { font-family: "Source Serif 4", Georgia, serif; font-weight: 600; color: var(--ink); font-size: 1.08rem; }
  .cal-head span::first-letter { text-transform: uppercase; }
  .cal-head button { background: none; border: 1px solid var(--line); width: 36px; height: 36px; border-radius: 50%;
                     color: var(--ink); font-size: 1.2rem; line-height: 1; }
  .cal-head button:disabled { opacity: .25; cursor: default; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
  #cal-wd div { font-size: .75rem; color: var(--muted); padding: 2px 0 4px; }
  #cal-days.loading { opacity: .45; animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .2; } }
  .cd { position: relative; aspect-ratio: 1; max-height: 52px; border: none; border-radius: 12px; background: none;
        color: #b9bcc4; font-size: .98rem; padding: 0; }
  .cd.free { color: var(--ink); font-weight: 600; background: var(--soft); }
  .cd.free::after { content: ""; position: absolute; left: 50%; bottom: 6px; width: 5px; height: 5px; margin-left: -2.5px;
                    border-radius: 50%; background: var(--peach); }
  .cd.free:hover { background: #e3e8f4; }
  .cd.sel { background: var(--ink); color: #fff; }
  .cd.sel::after { background: #fff; }
  .cd.today { box-shadow: inset 0 0 0 1px var(--slate); }
  .cd:disabled { cursor: default; }

  .steps { display: flex; gap: 6px; list-style: none; padding: 0; margin: -8px 0 22px; counter-reset: st; }
  .steps li { flex: 1; font-size: .74rem; color: #a3a6ae; counter-increment: st; padding-top: 8px;
              border-top: 3px solid var(--pill); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .steps li::before { content: counter(st) ". "; }
  .steps li.done { border-color: var(--lav); color: var(--muted); }
  .steps li.cur { border-color: var(--ink); color: var(--ink); font-weight: 600; }
  .steps.hide { display: none; }

  #services .choice { display: flex; gap: 14px; align-items: flex-start; }
  #services .ic { flex: none; width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; }
  #services .ic svg { width: 26px; height: 26px; }
  #services .txt { flex: 1; min-width: 0; }
  .slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 8px; }
  .slot { padding: 11px 4px; background: var(--soft); border: 1px solid transparent; border-radius: 12px;
          color: var(--ink); font-weight: 600; transition: border-color .15s, background .15s; }
  .slot:hover { border-color: var(--slate); background: #e3e8f4; }
  .slot.taken { background: var(--pill); color: #a0a3ab; font-weight: 400; cursor: not-allowed; }
  .slot.taken span { display: block; font-size: .72rem; }
  .note { color: var(--muted); margin: 10px 0; }
  .picks { list-style: none; margin: 8px 0 0; padding: 0; }
  .picks li { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 6px 0; border-top: 1px solid #d9dbe2; }
  .picks li button { background: none; border: none; color: var(--slate); font-size: 1.2rem; line-height: 1; padding: 2px 8px; }
  .policy { margin: 18px 0 0; padding: 12px 14px; background: var(--soft); border-radius: 12px; font-size: .9rem; color: var(--slate); }
  .privacy { font-size: .85rem; color: var(--slate); margin: 6px 0 0 30px; }
  #privacy-more { color: var(--slate); }
  #repeat { margin-top: 0; border-style: solid; border-width: 1px; font-weight: 600; }
  #repeat-note { margin: -10px 0 14px; }
  .picks li > span:first-child { flex: 1; }
  /* На телефон: датата на един ред, бутоните (онлайн/на място, двоен час) под нея, за да не излизат извън полето. */
  @media (max-width: 560px) {
    .picks li:not(.sum) { flex-wrap: wrap; justify-content: flex-start; gap: 8px; }
    .picks li:not(.sum) > span:first-child { flex: 1 1 100%; }
  }
  s.old { color: #9aa0ad; font-weight: 400; }
  b.special { color: #b5651d; }
  .special-tag { display: inline-block; font-size: .72rem; font-weight: 600; color: #b5651d; background: #fbeee4; border-radius: 999px; padding: 1px 8px; }
  .mode-sw { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; flex-shrink: 0; }
  .picks li .mode-sw button { font-size: .78rem; padding: 4px 9px; color: var(--ink); border-radius: 0; }
  .picks li .mode-sw button.on { background: var(--ink); color: #fff; }
  .picks li .dbl { font-size: .78rem; padding: 4px 9px; color: var(--ink); border: 1px solid var(--line); border-radius: 999px; background: #fff; flex-shrink: 0; }
  .picks li .dbl.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .picks .sum { font-weight: 700; justify-content: flex-start; }
  .more { display: block; width: 100%; margin: -6px 0 18px; padding: 12px; background: var(--card); border: 2px dashed var(--slate);
          border-radius: 14px; color: var(--ink); font-weight: 700; }
  .picks-bar { margin-top: 16px; }
  .slot.picked { background: var(--ink); color: #fff; }
  .slot.picked span { display: block; font-size: .72rem; }
  .mine-lang { float: right; display: flex; gap: 4px; }
  .mine-lang button { background: none; border: 1px solid var(--line); border-radius: 999px; padding: 3px 9px; font-size: .78rem; color: var(--slate); }
  .mine-lang button.on { background: var(--ink); border-color: var(--ink); color: #fff; }
  .summary { background: var(--pill); padding: 14px 18px; border-radius: 14px; margin-bottom: 18px; color: var(--ink); }

  label { display: block; font-weight: 600; margin: 14px 0 5px; color: var(--ink); }
  input, textarea { width: 100%; font: inherit; padding: 11px 13px; border: 1px solid var(--line);
                    border-radius: 12px; background: var(--card); color: var(--text); }
  input:focus, textarea:focus { outline: none; border-color: var(--slate); box-shadow: 0 0 0 3px var(--soft); }
  textarea { min-height: 84px; resize: vertical; }
  .primary { margin-top: 22px; width: 100%; padding: 15px; background: var(--ink); color: #fff;
             border: none; font-weight: 600; font-size: 1.05rem; }
  .primary:hover { background: #2a3878; }
  .primary:disabled { opacity: .6; }
  .error { color: var(--danger); margin-top: 10px; }
  label.check { display: flex; gap: 10px; align-items: flex-start; font-weight: 400; color: var(--text); margin-top: 18px; }
  label.check input { width: 20px; height: 20px; margin: 2px 0 0; accent-color: var(--ink); flex: none; }
  .choice.center { text-align: center; color: var(--ink); font-weight: 600; margin-top: 12px; }
  #cancel-btn.armed, #cancelall-btn.armed { border-color: var(--danger); color: var(--danger); }
  #mine-cancelall { margin-top: 18px; }
  #mine-cancelall.stick { position: sticky; bottom: 0; z-index: 5; background: var(--bg); padding: 10px 0 12px; box-shadow: 0 -8px 16px -10px rgba(31,43,94,.35); }
  #mine-cancelall.stick .choice { margin: 0; }
  #mine-cancelall.stick .link-btn { margin-right: 18px; }
  #cancelall-btn[disabled] { opacity: .5; }

  .done { text-align: center; padding-top: 24px; }
  .done .big { width: 72px; height: 72px; margin: 0 auto 14px; border-radius: 50%; background: var(--peach);
               color: #fff; font-size: 2.2rem; line-height: 72px; }
  .done a { color: var(--slate); word-break: break-all; }

  .link-btn { background: none; border: none; color: var(--slate); font-weight: 600; padding: 6px 0; text-decoration: underline;
              text-underline-offset: 3px; }
  .mine-item { border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin-bottom: 10px;
               display: flex; gap: 14px; align-items: flex-start; break-inside: avoid; }
  .mine-when { flex: none; width: 92px; color: var(--ink); }
  .mine-when b { display: block; font-family: "Source Serif 4", Georgia, serif; font-size: 1.05rem; }
  .mine-when span { font-size: .9rem; color: var(--muted); }
  .mine-what { flex: 1; min-width: 0; }
  .mine-what b { color: var(--ink); }
  .mine-what small { display: block; color: var(--muted); }
  .mine-what .who { color: var(--text); font-weight: 600; }
  .mine-item .sel { flex: none; width: 22px; height: 22px; margin: 2px 0 0; accent-color: var(--danger); }
  .mine-item .change { flex: none; background: var(--soft); border: none; color: var(--ink); font-weight: 600; padding: 8px 12px; border-radius: 10px; }
  @media (max-width: 560px) {
    .mine-item { flex-wrap: wrap; }
    .mine-item .change { flex: 1 1 100%; }
  }
  .mine-month { font-family: "Source Serif 4", Georgia, serif; color: var(--ink); font-weight: 600; margin: 20px 0 8px; }
  .mine-month::first-letter { text-transform: uppercase; }
  .row-btns { display: flex; gap: 10px; margin-top: 18px; }
  .row-btns button { flex: 1; margin: 0; }
  .filter { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 6px; }
  .filter button { background: var(--card); border: 1px solid var(--line); color: var(--ink); padding: 7px 14px; border-radius: 999px; font-weight: 600; font-size: .92rem; }
  #mine-rename { margin: 0 0 8px; }
  #mine-rename input { margin: 6px 0; }
  #mine-rename .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .filter button.on { background: var(--ink); border-color: var(--ink); color: #fff; }

  /* Месечен график за печат: по една страница A4 за всеки месец */
  #sheets { display: none; }
  .sheet { position: relative; width: 277mm; height: 188mm; padding: 0 4mm 2mm; display: flex; flex-direction: column; color: var(--text);
           page-break-after: always; break-after: page; overflow: hidden; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .sheet > * { position: relative; }
  .sh-stripe { display: flex; height: 2.2mm; margin: 0 -4mm 5mm; border-radius: 2mm; overflow: hidden; }
  .sh-stripe i { flex: 1; }
  .sh-stripe i:nth-child(1) { background: var(--ink); } .sh-stripe i:nth-child(2) { background: var(--peach); }
  .sh-stripe i:nth-child(3) { background: var(--slate); } .sh-stripe i:nth-child(4) { background: var(--sage); }
  .sh-stripe i:nth-child(5) { background: var(--lav); }
  .sheet > img.sh-tree { position: absolute; right: -6mm; bottom: -8mm; height: 95mm; opacity: .07; }
  .sh-who i, .sh-motto i { font-style: normal; color: var(--peach); }
  table.plan td.tm { white-space: nowrap; }
  .sheet:last-child { page-break-after: auto; break-after: auto; }
  .sh-top { display: flex; align-items: center; gap: 6mm; }
  .sh-brand { display: flex; align-items: center; gap: 3mm; width: 62mm; flex: none; }
  .sh-brand img { height: 17mm; }
  .sh-brand b { display: block; font-family: "Source Serif 4", Georgia, serif; color: var(--ink); font-size: 13pt; }
  .sh-brand span { font-family: "Caveat", cursive; color: #4b524d; font-size: 12pt; line-height: 1; }
  .sh-title { flex: 1; text-align: center; }
  .sh-title h1 { font-size: 32pt; margin: 0; letter-spacing: .5px; }
  .sh-month { display: inline-block; margin-top: 1.5mm; padding: 1.2mm 7mm; border-radius: 99px; background: #fbeee4;
              color: var(--ink); font-weight: 600; letter-spacing: 3px; text-transform: uppercase; font-size: 11pt; }
  .sh-who { width: 62mm; flex: none; text-align: right; font-family: "Caveat", cursive; font-size: 34pt; color: var(--ink); line-height: 1; }
  .sh-who small { display: block; font-family: "Source Sans 3", sans-serif; font-size: 9pt; color: var(--muted); }
  .sh-body { flex: 1; display: flex; gap: 7mm; margin-top: 6mm; min-height: 0; }
  .sh-cal { width: 62mm; flex: none; }
  .sh-cal .mc { border: 1px solid var(--line); border-radius: 4mm; padding: 3mm; }
  .sh-cal .mc-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1mm; text-align: center; font-size: 9pt; }
  .sh-cal .mc-grid .wd { color: var(--muted); font-size: 7.5pt; }
  .sh-cal .mc-grid .d { padding: 1.2mm 0; border-radius: 2mm; color: #9a9ea8; }
  .sh-cal .mc-grid .d.has { background: var(--ink); color: #fff; font-weight: 600; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .sh-sum { margin-top: 5mm; border-radius: 4mm; background: var(--soft); padding: 3.5mm 4mm; color: var(--ink); font-size: 10.5pt; }
  .sh-special { font-weight: 700; color: #b5651d; }
  .sh-sum b { font-size: 14pt; display: block; font-family: "Source Serif 4", Georgia, serif; }
  .sh-motto { margin-top: 5mm; font-family: "Caveat", cursive; font-size: 17pt; color: var(--ink); line-height: 1.1;
               background: #fbeee4; border-radius: 4mm; padding: 3mm 4mm; transform: rotate(-1.5deg); }
  table.plan { flex: 1; width: 100%; border-collapse: separate; border-spacing: 0; font-size: 10.5pt; align-self: flex-start;
               border: 1px solid var(--line); border-radius: 4mm; overflow: hidden; }
  table.plan th { color: var(--ink); text-align: left; padding: 2.4mm 3mm; font-weight: 600; font-size: 10pt;
                  -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  table.plan td { padding: 2mm 3mm; border-top: 1px solid var(--line); }
  table.plan tr:nth-child(even) td { background: #f8f8fa; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  table.plan td.dt { font-weight: 600; color: var(--ink); white-space: nowrap; }
  table.plan td.box { text-align: center; }
  table.plan td.box span { display: inline-block; width: 4.2mm; height: 4.2mm; border: 1.3px solid var(--ink); border-radius: 1mm; vertical-align: middle; }
  table.plan { line-height: 1.3; }
  table.plan.dense { font-size: 9.5pt; }
  table.plan.dense td { padding: 1.3mm 3mm; }
  table.plan.dense2 { font-size: 8.5pt; }
  table.plan.dense2 th { padding: 1.5mm 2.5mm; }
  table.plan.dense2 td { padding: .8mm 2.5mm; }
  table.plan.dense2 td.box span { width: 3.4mm; height: 3.4mm; }
  .sh-foot { margin-top: 4mm; display: flex; justify-content: space-between; font-size: 8.5pt; color: var(--muted); }

  @media print {
    @page { size: A4 landscape; margin: 10mm; }
    body { background: #fff; }
    main { padding: 0; max-width: none; }
    main > *:not(#s-mine) { display: none !important; }
    #s-mine > *:not(#sheets) { display: none !important; }
    #sheets { display: block; }
  }
</style>
</head>
<body>

// Двоен час: включва се само ако след часа има свободно място и не застъпва друг избран час.
function toggleDouble(x, btn) {

  var test = { start: x.start, double: true };

  google.script.run.withSuccessHandler(function (res) {
    btn.disabled = false;

// ↻ Всеки избран час се повтаря всяка седмица (същия ден и час, същият начин) до края на неговия месец.
$('repeat').onclick = function () {
  var btn = $('repeat'), note = $('repeat-note');
  var groups = {};
  state.picks.forEach(function (x) {
    var month = x.date.slice(0, 7), key = x.label + (x.double ? '+' : '');
    for (var d = addDays(parseDay(x.date), 7); fmtDay(d).slice(0, 7) === month && fmtDay(d) <= state.config.maxDate; d = addDays(d, 7)) {
      (groups[key] = groups[key] || { label: x.label, double: !!x.double, dates: [], mode: {} }).dates.push(fmtDay(d));
      groups[key].mode[fmtDay(d)] = x.mode;
    }
  });
  var labels = Object.keys(groups);
  if (!labels.length) { note.textContent = t('repeatNone'); return; }
  btn.disabled = true; note.textContent = t('repeating');
  var added = 0, skipped = [], left = labels.length;
  labels.forEach(function (lb) {
    var g = groups[lb];
    google.script.run.withSuccessHandler(function (res) {
      (res || []).forEach(function (r) {
        var have = state.picks.some(function (x) { return x.start === r.start; });
        var cand = { start: r.start, label: r.label, date: r.date, mode: g.mode[r.date], double: g.double };
        var clash = state.picks.some(function (x) { return x.start !== r.start && overlaps(x, cand); });
        if (have) return;
        if (r.free && !clash) { state.picks.push(cand); added++; }
        else skipped.push(longDate(r.date) + ', ' + r.label);

}
// По една страница за месец: заглавие, малък календар с дните на часовете и таблица.
function renderSheets(items, email) {
  var wrap = $('sheets');
  wrap.innerHTML = '';
  var months = {};
  items.forEach(function (b) { (months[b.date.slice(0, 7)] = months[b.date.slice(0, 7)] || []).push(b); });
  var logo = document.querySelector('.brand .logo').src;
  var esc = function (v) { return String(v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); };
  var heads = [['colDate', '#e8eaf4'], ['colDay', '#fbeee4'], ['colTime', '#e6ebf3'], ['colService', '#ecedea'],
               ['colWho', '#fbeee4'], ['colDur', '#e9e9f4'], ['colPrice', '#e6ebf3'], ['colDone', '#ecedea']];
  Object.keys(months).sort().forEach(function (m) {
    var list = months[m];
    var students = [], keys = [];
    list.forEach(function (b) {
      var k = b.student.trim().toLowerCase();
      if (k && keys.indexOf(k) === -1) { keys.push(k); students.push(b.student.trim()); }
    });
    var showWho = students.length > 1;
    var sum = 0, mins = 0, full = 0, count = 0;
    var rows = list.map(function (b) {
      var s = state.config.services.filter(function (x) { return x.id === b.serviceId; })[0] || { name: {}, minutes: 0, price: 0 };
      var u = b.units === 2 ? 2 : 1, base = (s.price || 0) * u;
      var price = typeof b.price === 'number' ? b.price : base;
      sum += price; mins += s.minutes * u; full += Math.max(price, base); count += u;
      var d = parseDay(b.date);
      return '<tr><td class="dt">' + esc(d.toLocaleDateString(t('locale'), { day: '2-digit', month: '2-digit', timeZone: 'UTC' })) + '</td>' +
        '<td>' + esc(d.toLocaleDateString(t('locale'), { weekday: 'long', timeZone: 'UTC' })) + '</td>' +
        '<td class="tm">' + esc(b.time + '–' + b.endTime) + '</td>' +
        '<td>' + esc(((s.short || s.name)[state.lang] || '') + (b.mode === 'online' ? ' · ' + t('online') : '')) + '</td>' +
        (showWho ? '<td>' + esc(b.student) + '</td>' : '') +
        '<td>' + esc(u === 2 ? '2 × ' + s.minutes + ' ' + t('min') : s.minutes + ' ' + t('min')) + '</td>' +
        '<td>' + (price < base ? '<s class="old">' + base + ' €</s> ' : '') + esc(price ? price + ' €' : t('free')) + '</td><td class="box"><span></span></td></tr>';
    }).join('');
    var head = heads.filter(function (h) { return h[0] !== 'colWho' || showWho; })
      .map(function (h) { return '<th style="background:' + h[1] + '">' + esc(t(h[0])) + '</th>'; }).join('');
    // Малкият календар на месеца
    var first = parseDay(m + '-01'), days = {};
    list.forEach(function (b) { days[b.date] = true; });
    var cal = t('days').map(function (x) { return '<div class="wd">' + esc(x) + '</div>'; }).join('');
    for (var i = 1; i < isoWeekday(first); i++) cal += '<div></div>';
    for (var d = first; fmtDay(d).slice(0, 7) === m; d = addDays(d, 1)) {
      cal += '<div class="d' + (days[fmtDay(d)] ? ' has' : '') + '">' + d.getUTCDate() + '</div>';
    }
    // Името на детето горе само ако всички часове в листа са за него (час без име не е „негов“).
    var who = state.mineWho || (students.length === 1 && list.every(function (b) { return b.student.trim(); }) ? students[0] : '');
    var h = Math.floor(mins / 60), mm = mins % 60;
    var sheet = document.createElement('div');
    sheet.className = 'sheet';
    sheet.innerHTML = '<div class="sh-stripe"><i></i><i></i><i></i><i></i><i></i></div>' +
      '<img class="sh-tree" src="' + logo + '" alt="">' +
      '<div class="sh-top">' +
        '<div class="sh-brand"><img src="' + logo + '" alt=""><div><b>Jordanka Dulle</b><span>Lernen mit Freude.<br>Stärken fürs Leben.</span></div></div>' +
        '<div class="sh-title"><h1>' + esc(t('planTitle')) + '</h1><div class="sh-month">' + esc(monthName(m + '-01')) + '</div></div>' +
        '<div class="sh-who">' + (who ? esc(who) + ' <i>♥</i>' : '') + '<small>' + esc(email) + '</small></div>' +
      '</div>' +
      '<div class="sh-body">' +
        '<div class="sh-cal"><div class="mc"><div class="mc-grid">' + cal + '</div></div>' +
          '<div class="sh-sum"><b>' + count + ' ' + esc(t('lessonsN')) + '</b>' +
            esc((h ? h + ' h ' : '') + (mm ? mm + ' ' + t('min') : '')) +
            (full > sum
              // Ясно, без смятане: обикновената сума, специалната и разликата, всяка на свой ред.
              ? '<br>' + esc(t('total') + ': ' + full + ' €') +
                '<br><span class="sh-special">' + esc(cap(t('yourPrice')) + ': ' + sum + ' €') + '</span>' +
                '<br>' + esc(cap(t('youSave')) + ': ' + (full - sum) + ' €')
              : ' · ' + esc(t('total') + ' ' + sum + ' €')) + '</div>' +
          '<div class="sh-motto">Kleine Schritte,<br>große Ziele. <i>♥</i></div>' +
        '</div>' +
        '<table class="plan' + (list.length > 18 ? ' dense2' : list.length > 11 ? ' dense' : '') + '"><thead><tr>' + head + '</tr></thead><tbody>' + rows + '</tbody></table>' +
      '</div>' +
      '<div class="sh-foot"><span>' + esc(state.config.ownerPhone + ' · ' + state.config.ownerEmail) + '</span><span>' +
        esc(t('printedOn') + ' ' + new Date().toLocaleDateString(t('locale'))) + '</span></div>';
    wrap.appendChild(sheet);
  });
}
$('mine-print').onclick = function () { window.print(); };
$('mine-new').onclick = function () { state.moveFrom = null; renderServices(); show('s-service'); };
$('manage-back').onclick = loadMine;
$('done-mine').onclick = loadMine;
$('mine-ask-link').onclick = function () { $('mine-ask-msg').textContent = ''; show('s-mine-ask'); };
$('mine-form').onsubmit = function (e) {
  e.preventDefault();
  var email = $('mine-email').value.trim();
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { $('mine-ask-msg').textContent = t('needEmail'); return; }
  var btn = $('mine-send');
  btn.disabled = true;
  google.script.run
    .withSuccessHandler(function () { btn.disabled = false; $('mine-ask-msg').textContent = t('mineSent'); })
    .withFailureHandler(function () { btn.disabled = false; $('mine-ask-msg').textContent = t('error'); })
    .requestMyLink(email, state.lang);
};

// Преди избора на език заглавието е на езика на браузъра (немски, български или английски).
(function () {
  var nav = (navigator.language || 'en').slice(0, 2).toLowerCase();
  state.lang = nav === 'de' || nav === 'bg' ? nav : 'en';
  applyTexts();
})();

google.script.run.withSuccessHandler(function (cfg) {
  state.config = cfg;
  renderServices();
  if (BOOT.view === 'mine') return loadMine();
  if (BOOT.view === 'manage') {
    state.cur = { e: BOOT.e, t: BOOT.t };
    google.script.run
      .withSuccessHandler(function (b) { state.manage = b; renderManage(); })
      .withFailureHandler(function () { state.manage = { ok: false }; renderManage(); })
      .getBooking(BOOT.e, BOOT.t);
  }
}).getConfig();
</script>
</body>
